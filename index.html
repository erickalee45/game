<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Battle Loop — Placeholder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="battle-screen">

    <div class="fighter-panel" id="panel-enemy">
      <div class="fighter-name" id="name-enemy">Fighter B</div>
      <div class="hp-bar-outer">
        <div class="hp-bar-inner" id="hp-bar-enemy"></div>
      </div>
      <div class="hp-text" id="hp-text-enemy"></div>
    </div>

    <div class="fighter-panel" id="panel-player">
      <div class="fighter-name" id="name-player">Fighter A</div>
      <div class="hp-bar-outer">
        <div class="hp-bar-inner" id="hp-bar-player"></div>
      </div>
      <div class="hp-text" id="hp-text-player"></div>
    </div>

    <div id="battle-log"></div>

    <div id="controls">
      <button id="btn-attack">Attack</button>
      <button id="btn-restart" style="display:none;">Restart</button>
    </div>

  </div>

<script src="script.js"></script>
</body>
</html>
