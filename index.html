<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Battle Loop — Placeholder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="battle-screen">

    <div id="narration-box"></div>

    <div id="battle-stage">

      <div class="fighter-panel" id="panel-player">
        <div class="fighter-name" id="name-player"></div>
        <div class="hp-bar-outer">
          <div class="hp-bar-trail" id="hp-bar-trail-player"></div>
          <div class="hp-bar-inner" id="hp-bar-player"></div>
        </div>
        <div class="hp-text" id="hp-text-player"></div>
        <div class="sprite-placeholder" id="sprite-player">
          <img id="sprite-player-img" class="sprite-img" alt="" hidden>
        </div>
        <button id="btn-switch"><span>Switch Character</span></button>
        <div id="switch-panel" hidden></div>
      </div>

      <div id="move-panel">
        <div id="move-description">Hover or focus a move to see what it does.</div>
        <div id="move-buttons"></div>
      </div>

      <div class="fighter-panel" id="panel-enemy">
        <div class="fighter-name" id="name-enemy"></div>
        <div class="hp-bar-outer">
          <div class="hp-bar-trail" id="hp-bar-trail-enemy"></div>
          <div class="hp-bar-inner" id="hp-bar-enemy"></div>
        </div>
        <div class="hp-text" id="hp-text-enemy"></div>
        <div class="sprite-placeholder" id="sprite-enemy"></div>
      </div>

    </div>

    <button id="btn-restart" style="display:none;"><span>Restart</span></button>

  </div>

<script src="script.js"></script>
</body>
</html>
