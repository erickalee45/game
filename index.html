<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Battle Loop — Placeholder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="title-screen">
    <div id="title-menu">
      <button id="btn-new-game"><span>New Game</span></button>
      <button id="btn-extras"><span>Extras</span></button>
    </div>
  </div>

  <div id="extras-screen" hidden>
    <div id="extras-content">
      <p>[placeholder]</p>
      <button id="btn-extras-back"><span>Go Back</span></button>
    </div>
  </div>

  <div id="cutscene-screen" hidden>

    <div id="cutscene-stage">
      <img id="cutscene-bg" src="assets/cutscene_1.png" alt="Rest hub — Neutrophil, Macrophage, and Cytotoxic T Cell.">

      <button type="button" class="hotspot" id="hotspot-neutrophil" style="left:34.9%; top:8.8%; width:13.5%; height:64.3%;" aria-label="Talk to Neutrophil"></button>
      <button type="button" class="hotspot" id="hotspot-macrophage" style="left:51.6%; top:1.9%; width:16.1%; height:71.3%;" aria-label="Talk to Macrophage"></button>
      <button type="button" class="hotspot" id="hotspot-ctc" style="left:93.2%; top:0.9%; width:6.8%; height:59.3%;" aria-label="Talk to Cytotoxic T Cell"></button>

      <div class="speech-bubble" id="bubble-neutrophil" hidden style="right:calc(65.1% + 10px); top:10%;">
        <span></span><span></span><span></span>
      </div>
      <div class="speech-bubble" id="bubble-macrophage" hidden style="left:calc(67.7% + 10px); top:5%;">
        <span></span><span></span><span></span>
      </div>
      <div class="speech-bubble" id="bubble-ctc" hidden style="right:calc(6.8% + 10px); top:3%;">
        <span></span><span></span><span></span>
      </div>

      <div id="dialogue-box" hidden>
        <div id="dialogue-speaker"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-hint">(click to close)</div>
      </div>
    </div>

    <button id="btn-continue-fighting"><span>Continue Fighting -&gt;</span></button>

  </div>

  <div id="dialogue-warning-modal" hidden>
    <div id="dialogue-warning-box">
      <p>There's still more dialogue to explore. Are you sure you want to continue?</p>
      <div id="dialogue-warning-actions">
        <button id="btn-warning-yes"><span>Yes</span></button>
        <button id="btn-warning-no"><span>No</span></button>
      </div>
    </div>
  </div>

  <div id="battle-screen" hidden>

    <div id="narration-box"></div>

    <div id="battle-stage">

      <div class="fighter-panel" id="panel-player">
        <div class="fighter-name" id="name-player"></div>
        <div class="hp-bar-outer">
          <div class="hp-bar-trail" id="hp-bar-trail-player"></div>
          <div class="hp-bar-inner" id="hp-bar-player"></div>
        </div>
        <div class="hp-text" id="hp-text-player"></div>
        <div class="sprite-placeholder" id="sprite-player">
          <img id="sprite-player-img" class="sprite-img" alt="" hidden>
        </div>
        <button id="btn-switch"><span>Switch Character</span></button>
        <div id="switch-panel" hidden></div>
      </div>

      <div id="move-panel">
        <div id="move-description">Hover or focus a move to see what it does.</div>
        <div id="move-buttons"></div>
      </div>

      <div class="fighter-panel" id="panel-enemy">
        <div class="fighter-name" id="name-enemy"></div>
        <div class="hp-bar-outer">
          <div class="hp-bar-trail" id="hp-bar-trail-enemy"></div>
          <div class="hp-bar-inner" id="hp-bar-enemy"></div>
        </div>
        <div class="hp-text" id="hp-text-enemy"></div>
        <div class="sprite-placeholder" id="sprite-enemy"></div>
      </div>

    </div>

    <button id="btn-restart" style="display:none;"><span>Restart</span></button>

  </div>

<script src="script.js"></script>
</body>
</html>
